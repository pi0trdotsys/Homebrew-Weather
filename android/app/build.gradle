apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// versionName comes from the repo's package.json — the single source the web
// app also displays (src/lib/version.ts). versionCode stays here: it's an
// Android-only monotonic counter with no web equivalent.
def appVersionName = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json')).version

// Release signing key, loaded from android/keystore.properties (gitignored,
// alongside the .jks itself — see android/.gitignore).
//
// Why this exists: every release up to v0.6.0-beta.7 shipped an APK signed with
// the machine's *debug* keystore, which the Android SDK regenerates whenever it
// is missing or expired. It did regenerate between beta.6 and beta.7, so the two
// builds had different signing keys and Android refused to update one with the
// other (INSTALL_FAILED_UPDATE_INCOMPATIBLE) — every user had to uninstall and
// lose their widget configuration. A key that lives in a file we control, rather
// than one the SDK recreates behind our back, is what makes in-place updates
// possible at all.
//
// The config is optional on purpose: a fresh clone has no keystore.properties,
// and `assembleRelease` must still work there (producing an unsigned APK) rather
// than failing the build for anyone who isn't the release signer.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace = "dev.pi0trdotsys.homebrewweather"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dev.pi0trdotsys.homebrewweather"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 13
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (keystorePropsFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
                // Signature scheme versions are left to AGP. v2 arrived in API
                // 24, which is this app's minSdk, so v1 (JAR signing) buys
                // nothing here and AGP drops it — verified with
                // `apksigner verify --print-certs` on the built APK.
            }
        }
    }
    buildTypes {
        // Debug builds get their own applicationId, so they install *next to*
        // a release build instead of over it. The two are signed with
        // different keys (debug keystore vs. the release key below), and
        // Android refuses to replace an app with a differently-signed one — so
        // without the suffix, every switch between a dev build and the real
        // release meant uninstalling, which deletes the home-screen widget and
        // its per-widget config. Side by side, the release install (and the
        // widget on it) is never touched by development.
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        // Kept in sync with the sourceCompatibility Capacitor generates into
        // capacitor.build.gradle (applied below, and which wins last) so
        // Kotlin and Java agree on the same JVM bytecode target.
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = "21"
    }
    testOptions {
        unitTests {
            // PixelIcons' colour map calls android.graphics.Color.parseColor when
            // the object initialises, so touching its grids from a plain JVM test
            // would otherwise throw "not mocked". The grids under test are plain
            // strings; the stubbed colour value is irrelevant to them.
            // See src/test/.../WidgetContentTest.kt.
            returnDefaultValues = true
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Native home-screen widget (Kotlin) support.
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"
    implementation "androidx.work:work-runtime-ktx:2.9.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
